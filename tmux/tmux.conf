set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",xterm-256color:RGB,tmux*:RGB,screen*:RGB"
set-option -s set-clipboard on
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys,tmux*:extkeys,screen*:extkeys'

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'

set -g @rose_pine_variant 'main'

set-option -g default-shell /opt/homebrew/bin/fish

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind-key & kill-window
bind-key x kill-pane

# Open current pane's full scrollback history in nvim
bind-key o run-shell 'f=$(mktemp /tmp/tmux-scrollback.XXXXXX); tmux capture-pane -p -S - -E - -t "#{pane_id}" > "$f"; tmux new-window "nvim \"$f\"; rm -f \"$f\""'

# Open new panes in same directory as previous pane
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Start window panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set-window-option -g mode-keys vi

set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_window_separator ' ♠ ' # Replaces the default `:` between the window number and name

set -g @rose_pine_status_right_prepend_section '#(tmux-custom-status 2>/dev/null || echo p0)'

#yy Plain spaces between windows instead of the default nerd-font chevron
set -g @rose_pine_window_status_separator '  '

set -g @rose_pine_host 'off'
set -g @rose_pine_hostname_short 'off'
set -g @rose_pine_date_time ''
set -g @rose_pine_user 'off'
set -g @rose_pine_directory 'off'

# These are not padded
set -g @rose_pine_session_icon '' # Changes the default icon to the left of the session name
set -g @rose_pine_current_window_icon '' # Changes the default icon to the left of the active window name
set -g @rose_pine_folder_icon '' # Changes the default icon to the left of the current directory folder
set -g @rose_pine_username_icon '' # Changes the default icon to the right of the hostname
set -g @rose_pine_hostname_icon '󰒋' # Changes the default icon to the right of the hostname
set -g @rose_pine_date_time_icon '󰃰' # Changes the default icon to the right of the date module

# Very beta and specific opt-in settings, tested on v3.4, look at issue #10
set -g @rose_pine_prioritize_windows 'on' # Disables the right side functionality in a certain window count / terminal width
set -g @rose_pine_width_to_hide '80' # Specify a terminal width to toggle off most of the right side functionalit:e 
set -g @rose_pine_window_count '5' # Specify a number of windows, if there are more than the number, do the same as width_to_hide

run '~/.tmux/plugins/tpm/tpm'
