set-option -sa terminal-overrides ".xterm*:Tc"

# Forward OSC 52 from apps inside panes to the outer terminal's clipboard.
# tmux's default (external) silently drops it, breaking copy in TUIs like cruxi.
set-option -s set-clipboard on

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'rose-pine/tmux'

set-option -g default-shell /opt/homebrew/bin/fish

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind-key & kill-window
bind-key x kill-pane

# Open new panes in same directory as previous pane
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Start window panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set-window-option -g mode-keys vi

# Don't repeat the active window name on the left; the window list already shows it
set -g @rose_pine_disable_active_window_menu 'on'

set -g @rose_pine_status_right_prepend_section '#(tmux-custom-status 2>/dev/null || echo p0)'

# Plain spaces between windows instead of the default nerd-font chevron
set -g @rose_pine_window_status_separator '  '

run '~/.tmux/plugins/tpm/tpm'

# Hairline above the status bar: make it two lines tall, move the real bar down to
# line 1, and fill line 0 with underlined blanks so only the underscore shows.
# The grep keeps a re-source idempotent: without it, reloading would copy the
# hairline itself into line 1 and lose the real bar.
set -g status 2
run "tmux show -gv 'status-format[0]' | grep -q 'p1000' || tmux set -g 'status-format[1]' \"\$(tmux show -gv 'status-format[0]')\""
set -g 'status-format[0]' '#[fg=#908caa,underscore]#{p1000: }'
