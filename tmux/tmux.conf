set-option -sa terminal-overrides ".xterm*:Tc"

# Forward OSC 52 from apps inside panes to the outer terminal's clipboard.
# tmux's default (external) silently drops it, breaking copy in TUIs like cruxi.
set-option -s set-clipboard on

set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'jimeh/tmuxifier'
set -g @plugin 'rose-pine/tmux'

set-option -g default-shell /opt/homebrew/bin/fish

set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind-key & kill-window
bind-key x kill-pane

# Open new panes in same directory as previous pane
bind  c  new-window      -c "#{pane_current_path}"
bind  %  split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Start window panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

set-window-option -g mode-keys vi

set -g @rose_pine_disable_active_window_menu 'on'
set -g @rose_pine_window_separator ' → ' # Replaces the default `:` between the window number and name

set -g @rose_pine_status_right_prepend_section '#(tmux-custom-status 2>/dev/null || echo p0)'

# Plain spaces between windows instead of the default nerd-font chevron
set -g @rose_pine_window_status_separator '  '

run '~/.tmux/plugins/tpm/tpm'
